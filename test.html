        <title>Forklift Control Center</title>
        <style>
            * { box-sizing: border-box; }
            body { 
                margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; 
                background: #0d0e10; color: #ccc; font-family: 'Segoe UI', Tahoma, sans-serif;
                display: flex; flex-direction: column; user-select: none; -webkit-touch-callout: none;
            }
            
            /* Barre du haut */
            .header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; padding: 5px 15px; font-size: 12px; font-weight: bold; background: #000; color: #555; }
            .header > :first-child { justify-self: start; }
            .header .title { justify-self: center; }
            .header > :last-child { justify-self: end; }
            #modifiable {color: #ff0000; }
            .title { color: #00ff00; }
            .val-haut { color: #ccc; }

            /* Conteneur vidéo adapté */
            .cam-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; padding: 5px; }
            #stream { max-width: 100%; max-height: 100%; border: 1px solid #333; border-radius: 8px; object-fit: contain; }

            /* Conteneur principal des contrôles en bas */
            .controls-zone { display: flex; flex-direction: column; align-items: center; padding: 5px; gap: 5px; max-height: 55vh; }
            
            .panels-row-1 { display: flex; justify-content: center; gap: 5px; width: 100%; max-width: 700px; }
            .panels-row-2 { background: #1a1b1e; border: 1px solid #2a2b2f; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; }

            .panel { background: #1a1b1e; border: 1px solid #2a2b2f; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; }
            .panel.débug-panel { justify-content: center; }
            /* Grilles Boutons */
            .pad-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 220px; }
            .pad-2x3 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; width: 150px; align-content: start; }
            
            .btn { 
                background: #25262a; color: #aaa; border: 1px solid #333; border-radius: 6px; 
                font-size: 18px; padding: 12px 0; display: flex; flex-direction: column; justify-content: center; align-items: center; 
                cursor: pointer; touch-action: manipulation; outline: none; line-height: 1;
            }
            .btn:active { background: #3a3b40; }
            .btn.keyboard-active {background: #3a3b40; border-color: #555; color: #fff; }
            .btn-stop { background: #1a1b1e; }
            .btn-stop .stop-box { width: 14px; height: 14px; background: #ff3333; border-radius: 2px; }
            .hint { font-size: 9px; opacity: 0.4; margin-top: 4px; }

            /* Panneau Hauteur (Vertical) */
            .height-panel { width: 70px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
            .height-title { font-size: 9px; text-align: center; font-weight: bold; margin-bottom: 5px; }
            .btn-sq { width: 40px; height: 40px; font-size: 20px; border-color: #00d2ff; color: #00d2ff; }
            .btn-sq.rst { font-size: 11px; color: #ff9900; border-color: #ff9900; height: 30px; margin-top: 2px; }
            .btn-sq.debug { font-size: 20px; color: #ff0000; border-color: #ff0000; width: 65px; margin-top: 2px; }

            .slider-vert-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px 0; }
            input[type=range].vert { 
                writing-mode: bt-lr; -webkit-appearance: slider-vertical; appearance: slider-vertical; 
                width: 20px; height: 100px; margin: 0; accent-color: #00d2ff; 
            }

            /* Sliders du bas */
            .bottom-panel { flex: 1; display: flex; flex-direction: column; gap: 8px; width: 240px;}
            .slider-head { display: flex; justify-content: space-between; font-size: 10px; font-weight: bold; color: #888; }
            input[type=range].horiz { width: 100%; accent-color: #00d2ff; margin: 0; }
            input[type=range].horiz-srv { accent-color: #4444ff; }
            
            .preset-btns { display: flex; justify-content: space-between; gap: 4px; margin-top: 4px; }
            .preset-btns button { flex: 1; background: #25262a; color: #aaa; border: 1px solid #333; border-radius: 4px; font-size: 10px; padding: 6px 0; cursor: pointer; }
            .preset-btns button:active { background: #444; }

            /* Modal */
            .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); overflow-y: auto;}
            .modal-content { background-color: #fff; margin: 2vh auto; padding: 20px; border-radius: 12px; width: 90%; max-width: 800px; position: relative; color: #333; max-height: 96vh; display: flex; flex-direction: column; }
            .close-modal { position: absolute; right: 20px; top: 10px; font-size: 30px; font-weight: bold; cursor: pointer; z-index: 10; }

            @keyframes effet-flash {
                0% { opacity: 0; }
                50% { opacity: 1; }
                100% { opacity: 0; }
            }

            .debug-flash { animation: effet-flash 2s ease-in-out infinite; }
        </style>
    </head>
    <body>
        <div class="header">
            <span id="modifiable"></span>
            <span class="title">FORKLIFT A45</span>
            <span>H: <span id="v-haut-head">%HAUTEUR%</span> mm</span>
        </div>
        
        <div class="cam-wrapper"><img id="stream" src="" alt="Vidéo"></div>

        <div class="controls-zone">
            <div class="panels-row-1">
                <div class="panel débug-panel">
                    <button class="btn btn-sq debug" onclick="debugevent()">DÉBUG</button>
                </div>
                <!-- D-PAD Translations -->
                <div class="panel">
                    <div class="pad-3x3">
                        <button class="btn" data-action="forwleft" onpointerdown="cmd('forwleft','')" onpointerup="cmd('stop','')" onpointercancel="cmd('stop','')">↖</button>
                        <button class="btn" data-action="forward" onpointerdown="cmd('forward','')" onpointerup="cmd('stop','')" onpointercancel="cmd('stop','')">↑ <span class="hint">Z</span></button>
                        <button class="btn" data-action="forwright" onpointerdown="cmd('forwright','')" onpointerup="cmd('stop','')" onpointercancel="cmd('stop','')">↗</button>
                        <button class="btn" data-action="left" onpointerdown="cmd('left','')" onpointerup="cmd('stop','')" onpointercancel="cmd('stop','')">← <span class="hint">Q</span></button>
                        <button class="btn btn-stop" onclick="cmd('stop','')"><div class="stop-box"></div></button>
                        <button class="btn" data-action="right" onpointerdown="cmd('right','')" onpointerup="cmd('stop','')" onpointercancel="cmd('stop','')">→ <span class="hint">D</span></button>
                        <button class="btn" data-action="backleft" onpointerdown="cmd('backleft','')" onpointerup="cmd('stop','')" onpointercancel="cmd('stop','')">↙</button>
                        <button class="btn" data-action="backward" onpointerdown="cmd('backward','')" onpointerup="cmd('stop','')" onpointercancel="cmd('stop','')">↓ <span class="hint">S</span></button>
                        <button class="btn" data-action="backright" onpointerdown="cmd('backright','')" onpointerup="cmd('stop','')" onpointercancel="cmd('stop','')">↘</button>
                    </div>
                </div>

                <!-- D-PAD Rotations -->
                <div class="panel">
                    <div class="pad-2x3">
                        <button class="btn" data-action="turnBIGleft" onpointerdown="cmd('turnBIGleft','')" onpointerup="cmd('stop','')" onpointercancel="cmd('stop','')">↰ <span class="hint">A+Z</span></button>
                        <button class="btn" data-action="turnBIGright" onpointerdown="cmd('turnBIGright','')" onpointerup="cmd('stop','')" onpointercancel="cmd('stop','')">↱ <span class="hint">E+Z</span></button>
                        
                        <button class="btn" data-action="turnleft" onpointerdown="cmd('turnleft','')" onpointerup="cmd('stop','')" onpointercancel="cmd('stop','')">↺ <span class="hint">A</span></button>
                        <button class="btn" data-action="turnright" onpointerdown="cmd('turnright','')" onpointerup="cmd('stop','')" onpointercancel="cmd('stop','')">↻ <span class="hint">E</span></button>
                        
                        <button class="btn" data-action="retractBIGleft" onpointerdown="cmd('retractBIGleft','')" onpointerup="cmd('stop','')" onpointercancel="cmd('stop','')">↲ <span class="hint">A+S</span></button>
                        <button class="btn" data-action="retractBIGright" onpointerdown="cmd('retractBIGright','')" onpointerup="cmd('stop','')" onpointercancel="cmd('stop','')">↳ <span class="hint">E+S</span></button>
                    </div>
                </div>

                <!-- D-PAD Hauteur -->
                <div class="panel height-panel">
                    <div class="height-title">HAUT<br>FOURCHE</div>
                    <button class="btn btn-sq" onclick="btnHaut(1)">+</button>
                    <div class="slider-vert-container">
                        <input type="range" class="vert" id="hauteur" orient="vertical" min="0" max="162" value="%HAUTEUR%" oninput="sliderHauteur(this.value)">
                    </div>
                    <button class="btn btn-sq" onclick="btnHaut(-1)">-</button>
                    <button class="btn btn-sq rst" onclick="cmd('reset_hauteur','')">RST</button>
                </div>
                <div class="panels-row-2">
                    <!-- Vitesse -->
                    <div class="panel bottom-panel">
                        <div class="slider-head"><span>VITESSE</span><span id="v-vit">125</span></div>
                        <input type="range" class="horiz" min="50" max="255" value="125" oninput="updateVal('v-vit', this.value)" onchange="cmd('Vitesse', this.value)">
                    </div>
                    
                    <!-- Inclinaison Servo -->
                    <div class="panel bottom-panel">
                        <div class="slider-head"><span>INCLINAISON</span><span id="v-srv">1500</span></div>
                        <input type="range" class="horiz horiz-srv" id="servo" min="900" max="1950" value="1500" oninput="updateVal('v-srv', this.value)" onchange="cmd('Servo', this.value)">
                        <div class="preset-btns">
                            <button onclick="setServo(1150)">Baisser</button>
                            <button onclick="setServo(1340)">// Sol</button>
                            <button onclick="setServo(1500)">Horiz</button>
                            <button onclick="setServo(1750)">Relever</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="meme-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h2 id="modal-title"></h2>
            </div>
        </div>

        <script>
            DebugMode = false;
            let debugHeight = null;
            debugevent = function() {
                const title = document.getElementById('modifiable');
                DebugMode = !DebugMode;
                if(DebugMode) {
                    debugHeight = parseInt(document.getElementById('hauteur').value);
 
                    console.log('DEBUG MODE ACTIVÉ'); 
                } else { 
                    console.log('DEBUG MODE DÉSACTIVÉ'); 
                }
                title.textContent = DebugMode ? 'DÉBUG MODE ACTIVÉ' : '';
                const debugBtn = document.querySelector('.btn.debug');
                if (debugBtn) {
                    debugBtn.classList.toggle('debug-flash', DebugMode);
                }
                openModal(DebugMode);
            };

            document.getElementById('stream').src = 'http://' + window.location.hostname + ':81/stream';
            var ws = new WebSocket('ws://' + window.location.hostname + ':82/');
            window.oncontextmenu = function(e) { e.preventDefault(); e.stopPropagation(); return false; };

            function cmd(action, val) { if(ws.readyState === WebSocket.OPEN) { ws.send(action + ':' + val); } }
            function updateVal(id, val) { document.getElementById(id).innerText = val; }
            
            function setServo(val) {
                document.getElementById('servo').value = val;
                updateVal('v-srv', val);
                cmd('Servo', val);
            }

            function sliderHauteur(value) {
                const h = parseInt(value);
                if (DebugMode) {
                    debugHeight = h;
                    cmd('debug', h);
                } else {
                    cmd('hauteur', h);
                }
                updateVal('v-haut-head', h);
            }

            function btnHaut(delta) {
                let s = document.getElementById('hauteur');
                let h;
                if (DebugMode) {
                    debugHeight += delta;
                    h = debugHeight;
                    cmd('debug', h);
                } else {
                    h = parseInt(s.value) + delta;
                    if(h > 162) h = 162;
                    if(h < 0) h = 0;
                    s.value = h;
                    cmd('hauteur', h);
                }
                updateVal('v-haut-head', h);
            }
            
            ws.onmessage = function(event) {
                if(event.data.startsWith("H:")) {
                    var h = event.data.substring(2);
                    document.getElementById('hauteur').value = h;
                    updateVal('v-haut-head', h);
                }
            };

            // KEYBOARD LOGIC (Combinaisons de touches)
            const keys = { z: false, q: false, s: false, d: false, a: false, e: false };
            let isMoving = false;

            function updateMovement() {
                let action = 'stop';

                // Rotations larges combinées (Priorité)
                if (keys.a && keys.z) action = 'turnBIGleft';
                else if (keys.e && keys.z) action = 'turnBIGright';
                else if (keys.a && keys.s) action = 'retractBIGleft';
                else if (keys.e && keys.s) action = 'retractBIGright';

                // Rotations simples
                else if (keys.a) action = 'turnleft';
                else if (keys.e) action = 'turnright';

                // Traductions Diagonales
                else if (keys.z && keys.q) action = 'forwleft';
                else if (keys.z && keys.d) action = 'forwright';
                else if (keys.s && keys.q) action = 'backleft';
                else if (keys.s && keys.d) action = 'backright';

                // Translations simples
                else if (keys.z) action = 'forward';
                else if (keys.s) action = 'backward';
                else if (keys.q) action = 'left';
                else if (keys.d) action = 'right';

                // Illumination du bouton correspondant à l'action clavier
                document.querySelectorAll('.btn[data-action]').forEach(btn => {
                    btn.classList.toggle(
                        'keyboard-active',
                        btn.dataset.action === action
                    );
                });

                if (action !== 'stop') {
                    cmd(action, ''); isMoving = true;
                } else if (isMoving) {
                    cmd('stop', ''); isMoving = false;
                }
            }

            document.addEventListener('keydown', (e) => {
                if (e.repeat) return; 
                let k = e.key.toLowerCase();
                if (keys.hasOwnProperty(k)) { keys[k] = true; updateMovement(); }
            });
            document.addEventListener('keyup', (e) => {
                let k = e.key.toLowerCase();
                if (keys.hasOwnProperty(k)) { keys[k] = false; updateMovement(); }
            });

            function openModal(debug) {
                const modal = document.getElementById('meme-modal');
                const container = document.getElementById('modal-media-container');
                const title = document.getElementById('modal-title');
                
                modal.style.display = 'block';
                document.body.style.overflow = 'hidden';
                title.textContent = 'Mode debug ' + (debug ? 'activé, les limites de hauteur pour la fourche sont désactivées pour les boutons + et -. Pour désaciver le mode debug, appuyez à nouveaux sur le bouton DÉBUG' : 'désactivé, les limites sont réactivées');
                const closeModal = () => {
                    modal.style.display = 'none';
                    document.body.style.overflow = '';
                };
                const closeBtn = document.querySelector('.close-modal');
                closeBtn.onclick = closeModal;
                window.onclick = (event) => {
                    if (event.target == modal) closeModal();
                };
                const escHandler = (event) => {
                    if (event.key === "Escape") {
                        closeModal();
                        window.removeEventListener('keydown', escHandler);
                    }
                };
                window.addEventListener('keydown', escHandler);
            }

            window.onpopstate = function(event) {
                const modal = document.getElementById('meme-modal');
                if (modal && modal.style.display === 'block') {
                    document.querySelector('.close-modal').click();
                }
            };
        </script>
    </body>
</html>
